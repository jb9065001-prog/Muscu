<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet V6.3</title>
<meta name="description" content="Carnet d'entraînement V6.3 : séances, minuteur, suivi des charges et graphiques. Les données restent sur ce téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#F2F1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B17" media="(prefers-color-scheme: dark)">
<script>try{var __t=localStorage.getItem("carnet62.theme");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bar" id="bar">
  <div class="wrap bar-in">
    <button id="menuBtn" class="bar-main" type="button" aria-label="Ouvrir le menu" aria-controls="top" aria-expanded="false">
      <span class="bar-ico" data-ic="menu" data-sz="22"></span>
      <span class="bar-tx"><span id="barTitle" class="bar-title">Carnet</span><span id="barSub" class="bar-sub"></span></span>
    </button>
    <span id="barDot" class="sdot" data-s="busy" aria-hidden="true"></span>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<header class="top" id="top" aria-label="Menu">
  <div class="dr-in">
    <div class="dr-head">
      <div class="brand"><b>Carnet</b> · V6.3 <span class="bld" id="bld"></span></div>
      <button id="menuClose" class="dr-close" type="button" aria-label="Fermer le menu" data-ic="close" data-sz="20"></button>
    </div>
    <span id="sync" class="sync" data-s="busy">Connexion…</span>
    <div class="weekbar">
      <button id="wkPrev" class="wk-btn" type="button" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
      <div class="wk-mid"><div id="wkTitle" class="wk-title">Semaine 3</div><div id="wkSub" class="wk-sub">19 oct. – 25 oct.</div></div>
      <span id="wkPhase" class="phase">Calibrage</span>
      <button id="wkNext" class="wk-btn" type="button" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    </div>
    <nav aria-label="Navigation"><div class="tabs" id="tabs" role="tablist"></div></nav>
    <div class="dr-set">
      <span class="dr-set-t">Apparence</span>
      <div class="seg" role="group" aria-label="Thème">
        <button type="button" data-theme-set="auto" aria-pressed="true"><span data-ic="auto" data-sz="16"></span>Auto</button>
        <button type="button" data-theme-set="light" aria-pressed="false"><span data-ic="sun" data-sz="16"></span>Clair</button>
        <button type="button" data-theme-set="dark" aria-pressed="false"><span data-ic="moon" data-sz="16"></span>Sombre</button>
      </div>
      <label class="sw"><span>Minuteur automatique<small>Le repos démarre quand tu notes une série</small></span><input type="checkbox" id="autoRest" checked></label>
    </div>
  </div>
</header>

<main id="main" class="wrap main"></main>

<div id="timer" class="timer" hidden>
  <div class="wrap timer-in">
    <div class="t-info"><span id="tLabel" class="t-label">Repos</span><span id="tTime" class="t-time">0:00</span></div>
    <div class="t-btns"><button id="tPlus" class="t-btn" type="button">+15 s</button><button id="tSnd" class="t-ico" type="button" aria-pressed="true" aria-label="Son du minuteur : activé"><svg class="on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4s2-1.500 2-6.500Z"/><path d="M10 19.500a2.200 2.200 0 0 0 4 0"/></svg><svg class="off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 9-5.200M18 9.500c0 5 2 6.500 2 6.500H7"/><path d="M10 19.500a2.200 2.200 0 0 0 4 0"/><path d="M3 3l18 18"/></svg></button><button id="tStop" class="t-btn" type="button">Fermer</button></div>
  </div>
  <div class="t-bar"><span id="tFill"></span></div>
</div>
<div id="tip" class="tip" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
