<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet V6.2</title>
<meta name="description" content="Carnet d'entraînement V6.2 : séances, minuteur, suivi des charges et graphiques. Les données restent sur ce téléphone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1218" media="(prefers-color-scheme: dark)">
<style>
/* Base (aucune ressource externe : l'app fonctionne hors connexion) */
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout : une colonne étroite façon carnet de salle — en-tête collant (semaine + onglets de séance), fiches d'exercice qui servent aussi de feuille de saisie, minuteur de repos fixé en bas. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#111923; --muted:#586474; --line:#D4DAE2;
  --accent:#2340D8; --accent-ink:#FFFFFF; --accent-soft:#E1E6FB;
  --good:#0F7356; --good-soft:#DCF1E8; --warn:#955600; --warn-soft:#FAEDD6; --bad:#B12419; --bad-soft:#FBE3E0;
  --f-display:"Avenir Next Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#151C25; --surface-2:#1A2330; --ink:#E5EAF0; --muted:#97A3B3; --line:#283241;
    --accent:#8298FF; --accent-ink:#0A0F1F; --accent-soft:#1E274E;
    --good:#4FC79B; --good-soft:#12302A; --warn:#F1B456; --warn-soft:#352914; --bad:#FF8276; --bad-soft:#3A1A17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#151C25; --surface-2:#1A2330; --ink:#E5EAF0; --muted:#97A3B3; --line:#283241;
  --accent:#8298FF; --accent-ink:#0A0F1F; --accent-soft:#1E274E;
  --good:#4FC79B; --good-soft:#12302A; --warn:#F1B456; --warn-soft:#352914; --bad:#FF8276; --bad-soft:#3A1A17;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{padding-block:10px 4px;display:grid;gap:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex:none}
.brand b{color:var(--ink);font-weight:700}
.top-in>*{min-width:0}
.sync{font-size:12px;color:var(--muted);display:block;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync[data-s="ok"]::before{background:var(--good)}
.sync[data-s="busy"]::before{background:var(--accent)}
.sync[data-s="local"]::before{background:var(--warn)}
.sync[data-s="err"]::before{background:var(--bad)}
.weekbar{display:flex;align-items:center;gap:10px}
.wk-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center}
.wk-btn:disabled{opacity:.35;cursor:default}
.wk-mid{flex:1;min-width:0}
.wk-title{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
.wk-sub{font-size:13px;color:var(--muted)}
.phase{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.phase.light{background:var(--warn-soft);color:var(--warn)}
.tabs-scroll{overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;padding-block:6px 10px;width:max-content;min-width:100%}
.tab{display:flex;flex-direction:column;align-items:flex-start;padding:6px 12px 7px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-width:66px;position:relative;text-align:left}
.tab-k{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05}
.tab-l{font-size:11px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .tab-l{color:var(--accent-ink)}
.tab.done::after{content:"✓";position:absolute;top:4px;right:8px;font-size:12px;font-weight:700;color:var(--good)}
.tab[aria-selected="true"].done::after{color:var(--accent-ink)}

/* Contenu */
.main{padding-block:18px 150px;display:grid;gap:14px}
h1,h2,h3{text-wrap:balance}
.s-head{display:flex;gap:14px;align-items:center}
.s-code{font-family:var(--f-display);font-weight:700;font-size:60px;line-height:.82;color:var(--accent);flex:none}
.s-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.02;text-transform:uppercase}
.s-meta{color:var(--muted);font-size:14px;margin:3px 0 0}
.s-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--good)}
.chk.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.ghost{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:14px;margin:0}
.note b{font-family:var(--f-mono);font-weight:500}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
details.warm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.warm summary{padding:12px 16px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:12px;list-style:none}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary::after{content:"Afficher";font-size:13px;font-weight:500;color:var(--accent)}
details.warm[open] summary::after{content:"Masquer"}
.wlist{margin:0;padding:0 16px 14px 34px;display:grid;gap:7px}
.wi{display:flex;justify-content:space-between;gap:12px}
.dose{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Fiche exercice */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:10px;min-width:0}
.ex.skip{background:var(--surface-2)}
.ex-top{display:flex;align-items:flex-start;gap:10px}
.ex-id{font-family:var(--f-mono);font-size:12px;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);flex:none;margin-top:3px;white-space:nowrap}
.ex-name{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.08;margin:0;flex:1;min-width:0}
.ex-name small{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--warn);letter-spacing:0;margin-top:2px}
.rest{flex:none;font-family:var(--f-mono);font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.rest:hover{background:var(--accent-soft)}
.rx{font-family:var(--f-mono);font-size:13px;display:flex;flex-wrap:wrap;gap:3px 14px;align-items:baseline}
.rx .big{font-size:16px}
.rx .mut{color:var(--muted)}
.ss-note{margin:0;font-size:13.5px;color:var(--accent);font-weight:600}
.adv{font-size:14px;padding:8px 11px;border-radius:8px;display:grid;gap:2px;background:var(--surface-2);color:var(--ink)}
.adv[data-t="up"]{background:var(--good-soft);color:var(--good)}
.adv[data-t="hold"]{background:var(--accent-soft);color:var(--accent)}
.adv[data-t="down"]{background:var(--warn-soft);color:var(--warn)}
.adv .last{font-family:var(--f-mono);font-size:12px;opacity:.9}
.cues{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.cues li::marker{color:var(--muted)}
.cue-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-size:13px;color:var(--muted)}
.cue-foot a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.cue-foot a:hover{text-decoration:underline}
.ex>*{min-width:0}
.ver{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.ver select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);width:0;min-width:0;flex:1 1 auto;text-overflow:ellipsis}
.emom{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.emom li{display:grid;grid-template-columns:128px 1fr;gap:10px}
.emom b{font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--muted);padding-top:2px}
.log{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:10px 12px 12px;background:var(--accent-soft);border-radius:8px}
.log-h{flex:1 1 100%;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.log .in{background:var(--surface)}
.log .fld>span{color:var(--ink)}
.setbox{display:grid;gap:2px;justify-items:center}
.setbox span{font-size:11px;color:var(--muted)}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.in{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.in-load{width:128px}
.in-set{width:54px;text-align:center;font-variant-numeric:tabular-nums}
.in-num{width:96px;font-variant-numeric:tabular-nums}
.setrow{display:flex;gap:6px;flex-wrap:wrap}
.fld-note{flex:1 1 100%}
.fld-grow{flex:1 1 160px}
.in-note{width:100%}
.p-mut{margin:0;color:var(--muted);font-size:14px}

/* Plan */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.h2{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;line-height:1.1}
.hero-wk{display:grid;gap:6px}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;text-transform:uppercase}
.hero-num span{color:var(--muted);font-size:24px}
.hero-txt{margin:0;max-width:62ch}
.plan{display:grid}
.plan-row{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;width:100%;font:inherit}
.plan-row:first-child{border-top:0;padding-top:2px}
button.plan-row{cursor:pointer}
button.plan-row:hover .p-s b{color:var(--accent)}
.p-d{font-weight:600}
.p-s{min-width:0}
.p-s b{font-family:var(--f-display);font-size:18px;font-weight:600;margin-right:6px}
.p-s small{color:var(--muted);font-size:13px}
.p-st{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.p-st.ok{color:var(--good)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}
.wc{border:1px solid var(--line);border-radius:6px;padding:6px 3px 5px;text-align:center;background:var(--surface-2);cursor:pointer;color:var(--ink);display:grid;gap:1px;font:inherit}
.wc .n{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1}
.wc .p{font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .c{font-family:var(--f-mono);font-size:10px;color:var(--good);min-height:14px}
.wc.light{background:var(--warn-soft)}
.wc.vac{background:transparent;border-style:dashed}
.wc.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px;background:var(--surface-2)}
.legend i.l{background:var(--warn-soft)}
.legend i.v{background:transparent;border-style:dashed}
.meas{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.tbl{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{padding:6px 10px 6px 0;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tbl td{font-variant-numeric:tabular-nums}

/* Règles */
.prose{max-width:68ch}
.prose p,.prose ul,.prose ol{margin:0 0 10px}
.prose ul,.prose ol{padding-left:20px;display:grid;gap:5px}
.prose p:last-child,.prose ul:last-child,.prose ol:last-child{margin-bottom:0}
.prose b{font-weight:600}

/* Progrès */
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filter-row select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);flex:1 1 220px;min-width:0;width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.tile-l{font-size:12px;color:var(--muted)}
.tile-v{font-size:22px;font-weight:600;line-height:1.15}
.tile-d{font-size:12.5px;color:var(--muted)}
.tile-d.pos{color:var(--good)}
.viz{display:grid;gap:4px;min-width:0}
.viz-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.viz-t{font-weight:600;font-size:14.5px}
.viz-s{font-size:12px;color:var(--muted)}
.viz svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.viz .ax{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.viz .lbl{font-size:12px;font-weight:600;fill:var(--ink)}
.viz .grid{stroke:var(--line);stroke-width:1}
.viz .band{fill:var(--warn-soft)}
.viz .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.viz .col{fill:var(--accent)}
.viz .col.on{opacity:.75}
.viz .xh{stroke:var(--muted);stroke-width:1}
.viz .hit{fill:transparent;cursor:pointer}
.viz-empty{border:1px dashed var(--line);border-radius:8px;padding:18px 14px;color:var(--muted);font-size:14px;text-align:center}
details.tv summary{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
details.tv .tbl-wrap{margin-top:6px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;box-shadow:0 6px 18px rgba(0,0,0,.14);display:grid;gap:1px;max-width:220px}
.tip b{font-size:14px}
.tip span{font-size:12px;color:var(--muted)}
.stack{display:grid;gap:16px}

/* Indicateur d'enregistrement */
.log-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.log-st{font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--good);white-space:nowrap}
.log-st[data-st="busy"]{color:var(--muted);font-weight:500}
.log-st[data-st="err"]{color:var(--bad)}
.sync.flash{color:var(--good);font-weight:600}
.sync.flash[data-s="err"]{color:var(--bad)}

/* Programme déroulant (onglet Plan) */
.prog{display:grid;gap:10px}
details.ps{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
details.ps>summary,details.pe>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
details.ps>summary::-webkit-details-marker,details.pe>summary::-webkit-details-marker{display:none}
details.ps>summary{padding:12px 14px}
details.ps>summary::after,details.pe>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px auto;transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.ps-code{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:.9;color:var(--accent);width:28px;text-align:center;flex:none}
.ps-t{display:grid;min-width:0}
.ps-t b{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.ps-t small,.pe-t small{font-size:12.5px;color:var(--muted)}
.ps-body{display:grid;gap:8px;padding:0 10px 12px}
details.pe{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.pe>summary{padding:10px 12px}
details.pe>summary .ex-id{margin-top:0}
.pe-t{display:grid;min-width:0;font-weight:600;line-height:1.25}
.pe-t small{font-weight:400}
.pe-body{display:grid;gap:10px;padding:2px 12px 14px}
.pe-body h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pe-body ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.pe-rx{font-family:var(--f-mono);font-size:13px;display:grid;gap:2px}
.pe-mus{font-size:14px;margin:0}
.pe-mus b{font-weight:600}
.pe-links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.pe-links a,.pe-open{color:var(--accent);font-weight:600;text-decoration:none}
.pe-open{border:0;background:none;padding:6px 0;cursor:pointer;text-align:left}
.pe-var li b{font-weight:600;color:var(--warn)}
details.pw{border:1px dashed var(--line);border-radius:8px}
details.pw>summary{padding:9px 12px;cursor:pointer;font-weight:600;font-size:14px}
details.pw .wlist{padding-top:2px}
.an-fig{margin:0}
.an-pair{display:flex;justify-content:center;gap:4px}
.an{width:46%;max-width:150px;height:auto;display:block}
.an-body path,.an-body circle,.an-body rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2}
.an .mo{fill:var(--line);stroke:var(--surface);stroke-width:1}
.an .mp{fill:var(--accent);stroke:var(--surface);stroke-width:1}
.an .ms{fill:var(--accent);fill-opacity:.42;stroke:var(--surface);stroke-width:1}
.an .an-gap{stroke:var(--surface);stroke-width:1.6;fill:none}
.an-cap{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.an-cap i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.an-cap i.mp{background:var(--accent)}
.an-cap i.ms{background:var(--accent);opacity:.42}

/* Minuteur */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px rgba(0,0,0,.18)}

.t-info{min-width:0}
.t-label{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.t-time{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.t-btns{display:flex;gap:8px;flex:none}
.t-btn{font-weight:600;padding:9px 12px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.t-bar{height:4px;background:var(--muted)}
.t-bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.timer.end .t-bar span{background:var(--surface)}
@media (prefers-reduced-motion: reduce){.t-bar span{transition:none}}
@media (max-width:560px){
  .s-code{font-size:50px}
  .s-title{font-size:26px}
  .emom li{grid-template-columns:1fr;gap:0}
  .plan-row{grid-template-columns:74px 1fr auto}
}

function peBody(ex,n,sid){
  var h='',m=muscOf(ex.id);
  var r=rx(ex,n,null),u=r.unit==="s"?" s":"";
  if(m) h+=anatBlock(m);
  var k=kindOf(ex,null);
  h+='<div class="pe-rx">';
  if(r.skip) h+='<span>S'+n+' : pas cet exercice cette semaine.</span>';
  else h+='<span><b>S'+n+'</b> : '+(k==="emom"?r.sets+' min × '+r.lo+' / min':r.sets+' × '+(r.lo===r.hi?r.lo:r.lo+'-'+r.hi)+u+(ex.side?' / '+ex.side:''))+' · '+esc(rirFor(ex,n))+'</span>';
  h+='<span>'+esc(ex.tempo)+(ex.restTxt&&k!=="emom"?' · repos '+esc(ex.restTxt):'')+'</span>';
  if(ex.start) h+='<span>Départ : '+esc(ex.start)+'</span>';
  if(ex.up&&k==="std") h+='<span>Progression : '+esc(ex.up)+'</span>';
  h+='</div>';
  if(ex.ss){var o=ALLEX[ex.ss];h+='<p class="ss-note" style="margin:0">Superset avec '+esc(o.label||o.id)+' : tu alternes les deux.</p>';}
  if(ex.cues&&ex.cues.length) h+='<div><h4>Comment faire</h4><ul>'+ex.cues.map(function(c){return '<li>'+esc(c)+'</li>';}).join("")+'</ul></div>';
  if(ex.alts&&ex.alts.length) h+='<div><h4>Variantes</h4><ul class="pe-var">'+ex.alts.map(function(a){return '<li><b>'+esc(a.tag)+'</b> · '+esc(a.name)+(a.start?' ('+esc(a.start)+')':'')+(a.cues&&a.cues[0]?'<br><span class="p-mut">'+esc(a.cues[0])+'</span>':'')+'</li>';}).join("")+'</ul></div>';
  h+='<div class="pe-links"><a href="'+yt(ex.q||ex.name)+'" target="_blank" rel="noopener">Démo vidéo ↗</a><a href="'+imgLink(ex.name)+'" target="_blank" rel="noopener">Images en ligne ↗</a></div>';
  return h;
}

      '<div><h4>Comment faire</h4><ul><li>Course facile sur terrain plat, en gardant la possibilité de parler en phrases complètes.</li><li>Pendant les blocs : 4 à 6 accélérations progressives de 60 à 80 m à la fin.</li><li>Genou sensible : vélo, VTT ou marche rapide en côte (menu Version dans l’onglet Mer).</li></ul></div>'+
      '<div><h4>Mobilité, 6 min</h4><ul><li>Fente basse, étirement des fléchisseurs de hanche : 2 × 30 s / côté</li><li>Position 90/90 au sol : 1 min</li><li>Rotation thoracique : 8 / côté</li><li>Suspension passive à la barre : 2 × 30 s</li></ul></div></div>';
  } else {
    if(s.warm) body+=warmList(s.warm);
    s.ex.forEach(function(ex){
      var r=rx(ex,n,null),k=kindOf(ex,null),u=r.unit==="s"?" s":"";
      var sub=r.skip?"S"+n+" : pas cette semaine":"S"+n+" : "+(k==="emom"?r.sets+" min × "+r.lo:r.sets+" × "+(r.lo===r.hi?r.lo:r.lo+"-"+r.hi)+u)+(ex.restTxt&&k!=="emom"?" · repos "+ex.restTxt:"");
      body+=det("pe","e-"+ex.id,exSummary(ex.label||ex.id,ex.name,sub),'<div class="pe-body">'+peBody(ex,n,sid)+'</div>');
    });
    if(s.fin){
      var fm=MUSC[s.fin],mins=p.fin;
      body+=det("pe","e-"+s.fin,exSummary(s.fin,"Finisher cardio EMOM",mins?"S"+n+" : "+mins+" min":"S"+n+" : pas de finisher"),
        '<div class="pe-body">'+(fm?anatBlock(fm):'')+'<ul class="emom">'+FIN.base.rows.map(function(r){return '<li><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></li>';}).join("")+'</ul><div><h4>Comment faire</h4><ul>'+FIN.base.cues.map(function(c){return '<li>'+esc(c)+'</li>';}).join("")+'</ul></div><div><h4>Version genou, sans impact</h4><ul>'+FIN.alt.rows.map(function(r){return '<li>'+esc(r[0])+' : '+esc(r[1])+'</li>';}).join("")+'</ul></div><div class="pe-links"><a href="'+yt("burpees technique")+'" target="_blank" rel="noopener">Démo vidéo ↗</a></div></div>');
    }
    body+='<p class="p-mut" style="margin:2px 4px 0">'+esc(COOL)+'</p>';
  }
  body+='<button type="button" class="pe-open" data-tab="'+sid+'">Ouvrir la séance '+sid+' pour noter mes reps →</button>';
  var nEx=s.ex.length,sub=s.day+" · "+(sid==="E"?p.cardio+" min":s.dur)+(nEx?" · "+nEx+" exercices"+(s.fin?" + finisher":""):"");
  return det("ps","s-"+sid,'<span class="ps-code">'+sid+'</span><span class="ps-t"><b>'+esc(s.title)+'</b><small>'+esc(sub)+'</small></span>','<div class="ps-body">'+body+'</div>');
}

function findPrev(ex,n,v){
  var fb=null;
  for(var k=n-1;k>=FIRST;k--){
    var e=entry(k,ex.id);
    if(!hasData(e)||(e.v||"")!==v) continue;
    var p=phase(k);
    if(!p.light&&p.key!=="vac") return {n:k,e:e};
    if(!fb) fb={n:k,e:e};
  }
  return fb;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function advice(ex,n){
  var p=phase(n), alt=curAlt(ex), r=rx(ex,n,alt), k=kindOf(ex,alt), v=alt?alt.k:"";
  var start=(alt&&alt.start)||ex.start, up=(alt&&alt.up)||ex.up||"augmente un peu la difficulté";
  var u=r.unit==="s"?" s":"";
  if(r.skip) return null;
  var prev=findPrev(ex,n,v);
  if(k==="jump"){var b=prev&&num(prev.e.best);return {t:"hold",txt:"Qualité avant tout : arrête dès que la hauteur baisse.",last:b!=null?("S"+prev.n+" : meilleur saut "+b+" cm"):""};}
  if(k==="emom"){var tt=prev&&num(prev.e.total);return {t:"hold",txt:"Objectif : "+(r.sets*r.lo)+" reps propres au total, jamais à l’échec.",last:tt!=null?("S"+prev.n+" : "+tt+" reps"):""};}
  if(k==="fixed") return {t:"hold",txt:"Volume imposé par la semaine : n’en fais pas plus, même si c’est facile."};
  if(ex.speed&&!(alt&&alt.rx)) return {t:"hold",txt:"Vitesse avant tout : arrête la série dès que ça ralentit. "+cap(up)+"."};
  if(p.light) return {t:"hold",txt:"Semaine allégée : même charge que ta dernière séance, "+r.sets+" séries, sans forcer."};
  if(p.key==="reprise") return {t:"down",txt:"Reprise : environ −10 % par rapport à ta dernière charge de décembre."};
  if(!prev) return {t:"start",txt:"Départ : "+start+"."+(alt?" (version "+alt.tag.toLowerCase()+")":"")};
  var vals=setVals(prev.e), pr=rx(ex,prev.n,alt), res;
  var last="S"+prev.n+" : "+(prev.e.load?prev.e.load+" · ":"")+(vals.length?vals.join("/")+u:"—");
  if(!vals.length) return {t:"start",txt:"Départ : "+start+".",last:last};
  if(r.hi<pr.hi) return {t:"up",txt:"Nouveau format ("+r.lo+"-"+r.hi+u+") : ajoute environ 2,5 kg à ta dernière charge.",last:last};
  if(r.hi>pr.hi) return {t:"hold",txt:"Retour au format "+r.lo+"-"+r.hi+u+" : reprends une charge un peu plus légère que la semaine dernière.",last:last};
  var top=ex.lat&&!alt?(vals.length>=2&&vals[0]>=r.hi&&vals[1]>=r.hi):(vals[0]>=r.hi);
  if(top) res={t:"up",txt:(ex.lat&&!alt?"2 premières séries à "+r.hi:"1re série au plafond")+" : tu montes. "+cap(up)+"."};
  else if(vals.some(function(x){return x<r.lo;})) res=vals[0]<r.lo?{t:"down",txt:"1re série sous "+r.lo+u+" : reviens à la charge précédente."}:{t:"down",txt:"Une série sous "+r.lo+u+" : garde la charge et reconstruis les reps."};
  else res={t:"hold",txt:r.unit==="s"?"Même charge : vise +5 s sur la 1re série.":"Même charge : vise +1 rep sur la 1re série."};
  res.last=last;return res;
}

var LS_PROG="carnet62.prog";
function fmtN(v){return v==null?"–":String(Math.round(v*10)/10).replace(".",",");}
function parseLoad(s){
  if(s==null) return null;var t=String(s).replace(/,/g,".");
  var m=t.match(/(\d+(?:\.\d+)?)\s*[×xX*]\s*(\d+(?:\.\d+)?)/);if(m) return parseFloat(m[2]);
  var m2=t.match(/[-+]?\d+(?:\.\d+)?/);return m2?parseFloat(m2[0]):null;
}
function sum(a){return a.reduce(function(s,x){return s+x;},0);}
function niceTicks(lo,hi,count){
  if(hi===lo){hi=lo+1;lo=lo>0?lo-1:lo;}
  var raw=(hi-lo)/count,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),f=raw/mag;
  var step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag,t0=Math.floor(lo/step)*step,t1=Math.ceil(hi/step)*step,out=[];
  for(var v=t0;v<=t1+step/1000;v+=step) out.push(Math.round(v*1000)/1000);
  return out;
}

  if(!pts.length) return '<div class="viz">'+head+'<div class="viz-empty">'+esc(cfg.empty||"Rien de noté pour l’instant. Les valeurs apparaîtront ici dès ta première séance notée.")+'</div></div>';
  var W=chartW(),H=170,pl=36,pr=12,pt=14,pb=24,x0=pl,x1=W-pr,y0=H-pb,y1=pt,slots=LAST-FIRST+1,bw=(x1-x0)/slots;
  function X(n){return x0+bw*(n-FIRST)+bw/2;}
  var vals=pts.map(function(p){return p.y;}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(cfg.type==="col"||cfg.zero) lo=0;
  if(cfg.max!=null) hi=Math.max(hi,cfg.max);
  var ticks=cfg.ticks||niceTicks(lo,hi,3),tmin=ticks[0],tmax=ticks[ticks.length-1];
  function Y(v){return y0-(v-tmin)/((tmax-tmin)||1)*(y0-y1);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(cfg.title)+'" data-chart="'+id+'">';
  for(var n=FIRST;n<=LAST;n++){if(phase(n).light) s+='<rect class="band" x="'+(X(n)-bw/2).toFixed(1)+'" y="'+y1+'" width="'+bw.toFixed(1)+'" height="'+(y0-y1)+'"/>';}
  ticks.forEach(function(t){var y=Y(t).toFixed(1);s+='<line class="grid" x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(x0-6)+'" y="'+y+'" dy="3.5" text-anchor="end">'+String(Math.round(t*100)/100).replace(".",",")+'</text>';});
  for(var k=FIRST;k<=LAST;k+=(W<420?3:2)){s+='<text class="ax" x="'+X(k).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">S'+k+'</text>';}
  if(cfg.type==="col"){
    var cw=Math.min(16,Math.max(4,bw-4));
    pts.forEach(function(p,i){var x=X(p.n)-cw/2,y=Y(p.y),h=y0-y,r=Math.min(4,h,cw/2);
      if(h<=0) return;
      s+='<path class="col" id="'+id+'-m'+i+'" d="M'+x.toFixed(1)+' '+y0+'V'+(y+r).toFixed(1)+'Q'+x.toFixed(1)+' '+y.toFixed(1)+' '+(x+r).toFixed(1)+' '+y.toFixed(1)+'H'+(x+cw-r).toFixed(1)+'Q'+(x+cw).toFixed(1)+' '+y.toFixed(1)+' '+(x+cw).toFixed(1)+' '+(y+r).toFixed(1)+'V'+y0+'Z"/>';});
  } else {
    s+='<line class="xh" id="'+id+'-xh" x1="0" x2="0" y1="'+y1+'" y2="'+y0+'" visibility="hidden"/>';
    s+='<path class="ln" d="'+pts.map(function(p,i){return (i?"L":"M")+X(p.n).toFixed(1)+" "+Y(p.y).toFixed(1);}).join("")+'"/>';
    pts.forEach(function(p){s+='<circle class="dot" cx="'+X(p.n).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4"/>';});
    var lp=pts[pts.length-1],lx=X(lp.n),anchor=lx>x1-40?"end":"start";
    s+='<text class="lbl" x="'+(anchor==="end"?lx-8:lx+8).toFixed(1)+'" y="'+(Y(lp.y)-8).toFixed(1)+'" text-anchor="'+anchor+'">'+fmtN(lp.y)+(cfg.unit?" "+esc(cfg.unit):"")+'</text>';
  }
  pts.forEach(function(p,i){s+='<rect class="hit" x="'+(X(p.n)-bw/2).toFixed(1)+'" y="'+y1+'" width="'+bw.toFixed(1)+'" height="'+(y0-y1)+'" data-chart="'+id+'" data-i="'+i+'" data-cx="'+X(p.n).toFixed(1)+'" data-v="'+esc(fmtN(p.y)+(cfg.unit?" "+cfg.unit:""))+'" data-l="'+esc("S"+p.n+(p.tip?" · "+p.tip:""))+'"/>';});
  s+='</svg>';
  var tv='<details class="tv"><summary>Voir les valeurs</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Semaine</th><th>'+esc(cfg.title)+'</th><th>Détail</th></tr></thead><tbody>'+pts.map(function(p){return '<tr><td>S'+p.n+'</td><td>'+fmtN(p.y)+(cfg.unit?" "+esc(cfg.unit):"")+'</td><td>'+esc(p.tip||"")+'</td></tr>';}).join("")+'</tbody></table></div></details>';
  return '<div class="viz">'+head+s+tv+'</div>';
}
function tile(label,a,b,unit,goodUp){
  var d=(a!=null&&b!=null)?b-a:null,u=unit?" "+unit:"";
  var dTxt=d==null?"":(d===0?"stable depuis le début":(d>0?"+":"−")+fmtN(Math.abs(d))+u+" depuis le début");
  var pos=d!=null&&d!==0&&((d>0)===(goodUp!==false));
  return '<div class="tile"><span class="tile-l">'+esc(label)+'</span><span class="tile-v">'+(b==null?"–":fmtN(b)+u)+'</span><span class="tile-d'+(pos?" pos":"")+'">'+esc(dTxt||"pas encore de point de comparaison")+'</span></div>';
}
function progOptions(){
  var opts=[];
  ["A","B","C","D"].forEach(function(sid){
    var g={label:"Séance "+sid+" · "+S[sid].day,items:[]};
    S[sid].ex.forEach(function(ex){
      g.items.push({key:ex.id+"|",label:(ex.label||ex.id)+" · "+ex.name,ex:ex,alt:null});
      (ex.alts||[]).forEach(function(a){
        var used=false;for(var n=FIRST;n<=LAST;n++){var e=entry(n,ex.id);if((e.v||"")===a.k&&hasData(e)){used=true;break;}}
        if(used) g.items.push({key:ex.id+"|"+a.k,label:(ex.label||ex.id)+" · "+a.name+" (variante)",ex:ex,alt:a});
      });
    });
    opts.push(g);
  });
  return opts;
}
function exSeries(ex,alt){
  var v=alt?alt.k:"",k=kindOf(ex,alt),out=[];
  for(var n=FIRST;n<=LAST;n++){
    var e=entry(n,ex.id);if(!hasData(e)||(e.v||"")!==v) continue;
    var sv=setVals(e);
    out.push({n:n,load:parseLoad(e.load),loadTxt:e.load||"",sets:sv,total:sv.length?sum(sv):null,best:num(e.best),emom:num(e.total)});
  }
  return {k:k,rows:out};
}
function renderProgress(){
  chartSeq=0;
  var groups=progOptions(),all=[];groups.forEach(function(g){all=all.concat(g.items);});
  var sel=state.prog||lsGet(LS_PROG);
  if(!sel||!all.some(function(i){return i.key===sel;})){
    sel=null;for(var i=0;i<all.length&&!sel;i++){if(exSeries(all[i].ex,all[i].alt).rows.length) sel=all[i].key;}
    sel=sel||"A2|";
  }
  var item=all.filter(function(i){return i.key===sel;})[0],ex=item.ex,alt=item.alt,ser=exSeries(ex,alt),r=ser.rows;
  var unitReps=((alt&&alt.rx&&alt.rx.unit)||ex.unit)==="s"?"s":"reps";
  var h='<section class="s-head"><div class="s-code" aria-hidden="true">↗</div><div><h1 class="s-title">Progrès</h1><p class="s-meta">Tout ce que tu notes dans les séances, semaine après semaine. Les bandes colorées sont les semaines allégées.</p></div></section>';
  h+='<section class="card stack"><div class="filter-row"><select id="prog-ex" aria-label="Exercice à afficher">';
  groups.forEach(function(g){h+='<optgroup label="'+esc(g.label)+'">'+g.items.map(function(i){return '<option value="'+esc(i.key)+'"'+(i.key===sel?" selected":"")+'>'+esc(i.label)+'</option>';}).join("")+'</optgroup>';});
  h+='</select></div>';
  var first=r[0],last=r[r.length-1];
  if(ser.k==="jump"){
    h+='<div class="tiles">'+tile("Meilleur saut",first&&first.best,last&&last.best,"cm")+'</div>';
    h+=chart({title:"Meilleur saut",sub:"cm",type:"line",unit:"cm",pts:r.map(function(x){return {n:x.n,y:x.best};})});
  } else if(ser.k==="emom"){
    h+='<div class="tiles">'+tile("Total EMOM",first&&first.emom,last&&last.emom,"reps")+'</div>';
    h+=chart({title:"Total de l’EMOM",sub:"reps",type:"col",unit:"reps",pts:r.map(function(x){return {n:x.n,y:x.emom};})});
  } else {
    var withLoad=r.filter(function(x){return x.load!=null;});
    var tl=withLoad.length?tile("Charge",withLoad[0].load,withLoad[withLoad.length-1].load,"kg"):"";
    h+='<div class="tiles">'+tl+tile(unitReps==="s"?"Secondes, toutes séries":"Reps, toutes séries",first&&first.total,last&&last.total,unitReps)+tile("1re série",first&&first.sets[0],last&&last.sets[0],unitReps)+'</div>';
    if(!ex.noLoad||(alt&&alt.noLoad===0)) h+=chart({title:"Charge notée",sub:"kg · « 2 × 20 » compte 20",type:"line",unit:"kg",pts:r.map(function(x){return {n:x.n,y:x.load,tip:x.loadTxt};})});
    h+=chart({title:unitReps==="s"?"Secondes, toutes séries":"Reps, toutes séries",sub:unitReps==="s"?"secondes":"reps",type:"col",unit:unitReps==="s"?"s":"reps",pts:r.map(function(x){return {n:x.n,y:x.total,tip:(x.loadTxt?x.loadTxt+" · ":"")+x.sets.join("/")};})});
  }
  h+='</section>';
  /* Vue d'ensemble */
  var done=[],cardio=[],wt=[],ws=[],trows=[];
  for(var n=FIRST;n<=LAST;n++){
    var o=state.weeks[n]||{},dc=doneCount(n);if(dc) done.push({n:n,y:dc,tip:ORDER.filter(function(k){return o.done&&o.done[k];}).join(", ")});
    var e1=num(entry(n,"E1").min),a8=num(entry(n,"A8").min),c9=num(entry(n,"C9").min),tot=(e1||0)+(a8||0)+(c9||0);
    if(tot) cardio.push({n:n,y:tot,tip:"endurance "+fmtN(e1||0)+" + finishers "+fmtN((a8||0)+(c9||0))});
    var b=o.body||{};if(num(b.weight)!=null) wt.push({n:n,y:num(b.weight)});if(num(b.waist)!=null) ws.push({n:n,y:num(b.waist)});
    var t=o.tests||{};if(t.pull||t.push||t.jump) trows.push('<tr><td>S'+n+'</td><td>'+esc(t.pull||"–")+'</td><td>'+esc(t.push||"–")+'</td><td>'+esc(t.jump||"–")+'</td></tr>');
  }
  var totDone=sum(done.map(function(d){return d.y;})),totCardio=sum(cardio.map(function(d){return d.y;}));
  h+='<section class="card stack"><h2 class="h2" style="margin:0">Vue d’ensemble</h2>';
  var planned=0;for(var pw=FIRST;pw<=todayWeek();pw++) planned+=phase(pw).noD?4:5;
  h+='<div class="tiles"><div class="tile"><span class="tile-l">Séances faites</span><span class="tile-v">'+totDone+'</span><span class="tile-d">sur '+planned+' prévues jusqu’ici</span></div><div class="tile"><span class="tile-l">Cardio cumulé</span><span class="tile-v">'+fmtN(totCardio)+' min</span><span class="tile-d">endurance + finishers</span></div>'+tile("Poids moyen",wt.length?wt[0].y:null,wt.length?wt[wt.length-1].y:null,"kg")+'</div>';
  h+=chart({title:"Séances faites",sub:"sur 5",type:"col",ticks:[0,1,2,3,4,5],unit:"",pts:done,empty:"Coche « Séance faite » en haut de chaque séance pour remplir ce graphique."});
  h+=chart({title:"Cardio de la semaine",sub:"minutes",type:"col",unit:"min",pts:cardio,empty:"Note la durée du mercredi et les minutes des finishers."});
  h+=chart({title:"Poids moyen",sub:"kg · cap +0,25 à +0,5 kg par mois",type:"line",unit:"kg",pts:wt,empty:"Note ton poids moyen dans l’onglet Plan."});
  h+=chart({title:"Tour de taille",sub:"cm · alerte au-delà de +1 cm par mois",type:"line",unit:"cm",pts:ws,empty:"Note ton tour de taille dans l’onglet Plan, toutes les 4 semaines."});
  h+='<div class="viz"><div class="viz-h"><span class="viz-t">Tests</span><span class="viz-s">référence : 16 tractions (fin sept.)</span></div>'+(trows.length?'<div class="tbl-wrap" style="margin-top:4px"><table class="tbl"><thead><tr><th>Sem.</th><th>Tractions</th><th>Pompes</th><th>Saut (cm)</th></tr></thead><tbody>'+trows.join("")+'</tbody></table></div>':'<div class="viz-empty">Tests prévus en S8, S11 et S21 : les résultats se notent dans l’onglet Plan.</div>')+'</div>';
  return h+'</section>';
}
var tipEl=document.getElementById("tip"),tipOn=null;
function showTip(hit,x,y){
  var cid=hit.getAttribute("data-chart"),i=hit.getAttribute("data-i");
  if(tipOn&&tipOn!==hit) hideTip();
  tipOn=hit;
  tipEl.textContent="";var b=document.createElement("b");b.textContent=hit.getAttribute("data-v");var s=document.createElement("span");s.textContent=hit.getAttribute("data-l");tipEl.appendChild(b);tipEl.appendChild(s);
  tipEl.hidden=false;
  var xh=document.getElementById(cid+"-xh");if(xh){xh.setAttribute("x1",hit.getAttribute("data-cx"));xh.setAttribute("x2",hit.getAttribute("data-cx"));xh.setAttribute("visibility","visible");}
  var m=document.getElementById(cid+"-m"+i);if(m) m.classList.add("on");
  var tw=tipEl.offsetWidth,th=tipEl.offsetHeight,left=Math.min(window.innerWidth-tw-8,Math.max(8,x-tw/2)),top=y-th-14;if(top<8) top=y+16;
  tipEl.style.left=left+"px";tipEl.style.top=top+"px";
}
function hideTip(){
  if(!tipOn) return;var cid=tipOn.getAttribute("data-chart"),i=tipOn.getAttribute("data-i");
  var xh=document.getElementById(cid+"-xh");if(xh) xh.setAttribute("visibility","hidden");
  var m=document.getElementById(cid+"-m"+i);if(m) m.classList.remove("on");
  tipOn=null;tipEl.hidden=true;
}
main.addEventListener("pointermove",function(e){var h=e.target.closest&&e.target.closest(".hit");if(h) showTip(h,e.clientX,e.clientY);else hideTip();});
main.addEventListener("pointerdown",function(e){var h=e.target.closest&&e.target.closest(".hit");if(h) showTip(h,e.clientX,e.clientY);else hideTip();});
main.addEventListener("pointerleave",hideTip);
window.addEventListener("scroll",hideTip,{passive:true});
var rsT=null;window.addEventListener("resize",function(){clearTimeout(rsT);rsT=setTimeout(function(){if(state.tab==="progres") requestRender();},200);});
function requestRender(){var a=document.activeElement;if(a&&main.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){pendingRender=true;return;}render();}
main.addEventListener("focusout",function(){setTimeout(function(){if(pendingRender) requestRender();},0);});

/* Menus déroulants du plan : on retient ce qui est ouvert */
main.addEventListener("toggle",function(e){var d=e.target;if(d&&d.dataset&&d.dataset.open){if(d.open) state.open[d.dataset.open]=1;else delete state.open[d.dataset.open];}},true);

/* ---------- Saisie ---------- */
function onField(t){
  if(t.dataset.ver!=null) return;
  if(t.dataset.body){var bw=+t.closest("[data-bodyw]").dataset.bodyw;wk(bw).body[t.dataset.body]=t.value.trim();scheduleSave(String(bw));return;}
  if(t.dataset.test){var tw=+t.closest("[data-testw]").dataset.testw;wk(tw).tests[t.dataset.test]=t.value.trim();scheduleSave(String(tw));return;}
  if(t.dataset.sf){var box=t.closest("[data-sess]"),sw=+box.dataset.w,o=wk(sw),ss=o.sess[box.dataset.sess]||(o.sess[box.dataset.sess]={});ss[t.dataset.sf]=t.value;scheduleSave(String(sw));return;}
  var card=t.closest("[data-ex]");if(!card||!t.dataset.f) return;
  markPending(card);
  var n=+card.dataset.w,id=card.dataset.ex,w=wk(n),en=w.ex[id]||(w.ex[id]={}),f=t.dataset.f;
  en.v=state.swaps[id]||"";
  if(/^s\d+$/.test(f)){var i=+f.slice(1);en.sets=en.sets||[];en.sets[i]=t.value.trim();for(var k=0;k<en.sets.length;k++){if(en.sets[k]==null) en.sets[k]="";}}
  else en[f]=t.value;
  scheduleSave(String(n));
}
main.addEventListener("input",function(e){var t=e.target;if(t.type==="checkbox"||t.tagName==="SELECT") return;onField(t);});
main.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.done){var n=state.week,o=wk(n);if(t.checked) o.done[t.dataset.done]=new Date().toISOString().slice(0,10);else delete o.done[t.dataset.done];var lab=t.closest(".chk");if(lab) lab.classList.toggle("on",t.checked);renderHeader();scheduleSave(String(n));return;}
  if(t.id==="imp"){if(t.files&&t.files[0]) readImport(t.files[0]);t.value="";return;}
  if(t.id==="prog-ex"){state.prog=t.value;lsSet(LS_PROG,t.value);render();return;}
  if(t.dataset.ver!=null){var id=t.dataset.ver;if(t.value) state.swaps[id]=t.value;else delete state.swaps[id];scheduleSave("swaps");var y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(t.tagName==="SELECT") onField(t);
});

/* ---------- Navigation ---------- */
function goTab(t){state.tab=t;try{history.replaceState(null,"","#"+t);}catch(e){}render();window.scrollTo(0,0);}
function goWeek(n){state.week=Math.min(LAST,Math.max(FIRST,n));render();}
document.addEventListener("click",function(e){
  var b=e.target.closest("button,[data-tab]");if(!b) return;
  if(b.dataset.tab){goTab(b.dataset.tab);return;}
  if(b.dataset.week){goWeek(+b.dataset.week);return;}
  if(b.dataset.rest){startTimer(+b.dataset.rest,b.dataset.label||"Repos",!!b.dataset.emom);return;}
  if(b.dataset.act==="export"){exportJSON();return;}
  if(b.dataset.act==="csv"){exportCSV();return;}
  if(b.dataset.act==="imp-ok"){applyImport();return;}
  if(b.dataset.act==="imp-cancel"){importing=null;render();return;}
  if(b.dataset.act==="cues"){state.cues=!state.cues;lsSet(LS_CUES,state.cues);render();return;}
  if(b.id==="wkPrev"){goWeek(state.week-1);return;}
  if(b.id==="wkNext"){goWeek(state.week+1);return;}
  if(b.id==="tPlus"){timer.end+=15000;timer.total+=15;tick();return;}
  if(b.id==="tStop"){stopTimer();return;}
});

/* ---------- Minuteur ---------- */
var timer={end:0,total:0,iv:null,emom:false,lastMin:0},actx=null,wl=null;
var tEl=document.getElementById("timer"),tTime=document.getElementById("tTime"),tLabel=document.getElementById("tLabel"),tFill=document.getElementById("tFill");
function audio(){try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC) actx=new AC();}if(actx&&actx.state==="suspended") actx.resume();}catch(e){}}
function beep(n,f){if(!actx) return;try{var t=actx.currentTime;for(var i=0;i<n;i++){var o=actx.createOscillator(),g=actx.createGain(),s=t+i*0.25;o.frequency.value=f||880;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.3,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+0.2);}}catch(e){}}
function lock(){try{if(navigator.wakeLock&&!wl){navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null;});},function(){});}}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null;}}catch(e){}}
function startTimer(sec,label,emom){audio();lock();timer.end=Date.now()+sec*1000;timer.total=sec;timer.emom=emom;timer.lastMin=0;tLabel.textContent=label;tEl.hidden=false;tEl.classList.remove("end");clearInterval(timer.iv);timer.iv=setInterval(tick,250);tick();}
function tick(){
  var leftMs=timer.end-Date.now(),left=Math.max(0,Math.ceil(leftMs/1000));
  tTime.textContent=mmss(left);
  tFill.style.width=Math.min(100,100*(1-left/Math.max(1,timer.total)))+"%";
  if(timer.emom){var el=Math.floor((timer.total-left)/60);if(el>timer.lastMin&&left>0){timer.lastMin=el;beep(1,1100);}}
  if(leftMs<=0){clearInterval(timer.iv);timer.iv=null;tEl.classList.add("end");tTime.textContent=timer.emom?"Terminé":"C’est reparti";beep(3);unlock();}
}
function stopTimer(){clearInterval(timer.iv);timer.iv=null;tEl.hidden=true;unlock();}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&timer.iv){wl=null;lock();}});

render();setSync();
})();
</script>
